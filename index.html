<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- =========================================================
       MAHDI GRAPH
       فایل کامل سایت — CSS و JavaScript داخل همین فایل است.
       
       تغییرات اصلی:
       1. نام و متن‌ها → قسمت BRAND / TEXTS
       2. لینک تلگرام و ایتا → قسمت SOCIAL LINKS
       3. تصاویر → پوشه images
       
       ساختار پیشنهادی:
       /
       ├── index.html
       └── images/
           ├── logo.png
           ├── work1.jpg
           ├── work2.jpg
           ├── work3.jpg
           ├── work4.jpg
           ├── more1.jpg
           ├── more2.jpg
           ├── ...
           └── more11.jpg
       
       برای اضافه کردن عکس:
       کافی است فایل عکس را داخل images قرار بدهی و
       در قسمت PORTFOLIO IMAGES نام آن را اضافه کنی.
       ========================================================= -->

  <title>MAHDI GRAPH | طراح گرافیک</title>

  <!-- Font Awesome 6 -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       RESET
       ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Vazirmatn", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(229, 28, 39, .08), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(20, 30, 70, .25), transparent 35%),
        #05070d;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body.no-scroll {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    ::selection {
      background: #e51c27;
      color: white;
    }

    /* =========================================================
       VARIABLES
       ========================================================= */

    :root {
      --red: #e51c27;
      --red-dark: #a90e18;
      --navy: #0b1020;
      --navy-2: #10182d;
      --black: #05070d;
      --white: #ffffff;
      --muted: #9da5b8;
      --glass: rgba(255,255,255,.055);
      --border: rgba(255,255,255,.10);
      --shadow: 0 25px 80px rgba(0,0,0,.45);
      --radius: 24px;
    }

    /* =========================================================
       SCROLLBAR
       ========================================================= */

    ::-webkit-scrollbar {
      width: 7px;
    }

    ::-webkit-scrollbar-track {
      background: #05070d;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--red);
      border-radius: 20px;
    }

    /* =========================================================
       BACKGROUND EFFECTS
       ========================================================= */

    .background-glow {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(100px);
      opacity: .13;
      z-index: -2;
    }

    .glow-1 {
      background: #e51c27;
      top: -150px;
      right: -100px;
    }

    .glow-2 {
      background: #183b9c;
      bottom: -150px;
      left: -100px;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 1000;
      padding: 18px 5%;
      transition: .3s;
    }

    header.scrolled {
      background: rgba(5,7,13,.75);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .header-inner {
      max-width: 1250px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
    }

    .brand-mini img {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,.12);
      background: #111827;
    }

    .brand-mini span {
      font-size: 15px;
    }

    .menu-btn {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(15px);
      color: white;
      cursor: pointer;
      font-size: 19px;
      transition: .3s;
    }

    .menu-btn:hover {
      background: var(--red);
      transform: translateY(-2px);
    }

    /* =========================================================
       DRAWER
       ========================================================= */

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px);
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: .35s;
    }

    .drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: -380px;
      width: min(380px, 90%);
      height: 100vh;
      z-index: 2001;
      padding: 30px;
      background:
        linear-gradient(145deg, rgba(18,24,45,.98), rgba(5,7,13,.99));
      border-left: 1px solid rgba(255,255,255,.1);
      transition: .4s cubic-bezier(.77,0,.18,1);
      overflow-y: auto;
    }

    .drawer.active {
      right: 0;
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }

    .drawer-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
    }

    .drawer-logo img {
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 12px;
    }

    .close-btn {
      border: 0;
      background: rgba(255,255,255,.06);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
    }

    .drawer-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .drawer-links a,
    .drawer-links button {
      width: 100%;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid transparent;
      background: transparent;
      color: #fff;
      text-align: right;
      cursor: pointer;
      font-size: 15px;
      transition: .25s;
    }

    .drawer-links a:hover,
    .drawer-links button:hover {
      background: rgba(229,28,39,.12);
      border-color: rgba(229,28,39,.25);
      color: #ff5962;
      transform: translateX(-4px);
    }

    .drawer-links i {
      width: 25px;
      margin-left: 8px;
    }

    .drawer-social {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid rgba(255,255,255,.08);
      display: flex;
      gap: 10px;
    }

    .social-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      transition: .3s;
    }

    .social-icon:hover {
      background: var(--red);
      transform: translateY(-3px);
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 130px 5% 100px;
      position: relative;
    }

    .hero-inner {
      width: 100%;
      max-width: 1250px;
      margin: auto;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 70px;
    }

    .hero-content {
      max-width: 700px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 100px;
      background: rgba(229,28,39,.09);
      border: 1px solid rgba(229,28,39,.2);
      color: #ff626b;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .eyebrow i {
      font-size: 8px;
    }

    .hero h1 {
      font-size: clamp(48px, 8vw, 95px);
      line-height: .95;
      letter-spacing: -4px;
      margin-bottom: 20px;
      font-weight: 900;
    }

    .hero h1 span {
      color: var(--red);
      display: block;
    }

    .hero-title {
      font-size: clamp(20px, 3vw, 30px);
      color: #e8eaf0;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .hero-description {
      color: var(--muted);
      line-height: 2;
      max-width: 620px;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 50px;
      padding: 0 21px;
      border-radius: 15px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: .3s;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--red);
      color: white;
      box-shadow: 0 12px 35px rgba(229,28,39,.25);
    }

    .btn-primary:hover {
      background: #ff2733;
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(229,28,39,.35);
    }

    .btn-outline {
      background: rgba(255,255,255,.04);
      border-color: var(--border);
      color: white;
      backdrop-filter: blur(10px);
    }

    .btn-outline:hover {
      border-color: rgba(229,28,39,.5);
      background: rgba(229,28,39,.08);
      transform: translateY(-3px);
    }

    .hero-social {
      display: flex;
      gap: 10px;
    }

    .hero-social a {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      color: #c5cad5;
      transition: .3s;
    }

    .hero-social a:hover {
      background: var(--red);
      color: white;
      transform: translateY(-4px);
    }

    .hero-visual {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .hero-card {
      width: min(400px, 100%);
      aspect-ratio: 1 / 1;
      border-radius: 35px;
      padding: 12px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      transform: rotate(3deg);
      transition: .5s;
    }

    .hero-card:hover {
      transform: rotate(0deg) translateY(-8px);
    }

    .hero-card-inner {
      width: 100%;
      height: 100%;
      border-radius: 27px;
      overflow: hidden;
      background: #0c1120;
      position: relative;
    }

    .hero-card-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-card-inner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(5,7,13,.7), transparent 50%);
      pointer-events: none;
    }

    .hero-card-label {
      position: absolute;
      bottom: 25px;
      right: 25px;
      left: 25px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: end;
    }

    .hero-card-label strong {
      font-size: 20px;
    }

    .hero-card-label small {
      color: #b4bac8;
    }

    /* =========================================================
       GENERAL SECTION
       ========================================================= */

    section {
      padding: 100px 5%;
    }

    .container {
      max-width: 1250px;
      margin: auto;
    }

    .section-head {
      margin-bottom: 40px;
    }

    .section-kicker {
      color: #ff5962;
      font-size: 13px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .section-title {
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 900;
      margin-bottom: 12px;
    }

    .section-description {
      color: var(--muted);
      line-height: 1.9;
      max-width: 650px;
      font-size: 14px;
    }

    /* =========================================================
       GLASS CARD
       ========================================================= */

    .glass-card {
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    /* =========================================================
       ABOUT
       ========================================================= */

    .about-grid {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 25px;
    }

    .about-info {
      padding: 35px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 330px;
    }

    .about-icon {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      background: rgba(229,28,39,.1);
      border: 1px solid rgba(229,28,39,.2);
      color: var(--red);
      border-radius: 18px;
      font-size: 23px;
      margin-bottom: 25px;
    }

    .about-info h3 {
      font-size: 25px;
      margin-bottom: 15px;
    }

    .about-info p {
      color: var(--muted);
      line-height: 2;
      font-size: 14px;
    }

    .about-text {
      padding: 35px;
    }

    .about-text p {
      color: #c0c5d0;
      line-height: 2.2;
      font-size: 15px;
      margin-bottom: 20px;
    }

    /* =========================================================
       STATS
       ========================================================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .stat {
      padding: 25px;
      text-align: center;
    }

    .stat strong {
      display: block;
      color: var(--red);
      font-size: 32px;
      font-weight: 900;
    }

    .stat span {
      display: block;
      color: var(--muted);
      margin-top: 5px;
      font-size: 13px;
    }

    /* =========================================================
       PORTFOLIO
       ========================================================= */

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .portfolio-item {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border-radius: 22px;
      cursor: pointer;
      background: #0b0f1a;
      border: 1px solid rgba(255,255,255,.08);
    }

    .portfolio-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .6s;
    }

    .portfolio-item:hover img {
      transform: scale(1.07);
    }

    .portfolio-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: end;
      padding: 20px;
      background: linear-gradient(to top, rgba(0,0,0,.8), transparent 55%);
      opacity: 0;
      transition: .35s;
    }

    .portfolio-item:hover .portfolio-overlay {
      opacity: 1;
    }

    .portfolio-overlay-content {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: center;
    }

    .portfolio-overlay small {
      color: #bbb;
    }

    .portfolio-overlay i {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--red);
    }

    .more-center {
      display: flex;
      justify-content: center;
      margin-top: 30px;
    }

    /* =========================================================
       ORDER
       ========================================================= */

    .order-box {
      padding: 45px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 30px;
      position: relative;
      overflow: hidden;
    }

    .order-box::before {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: var(--red);
      opacity: .08;
      filter: blur(50px);
      left: -80px;
      bottom: -100px;
    }

    .order-box h2 {
      font-size: clamp(28px, 4vw, 42px);
      margin-bottom: 12px;
    }

    .order-box p {
      color: var(--muted);
      line-height: 2;
      max-width: 650px;
      font-size: 14px;
    }

    .contact-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* =========================================================
       SOCIALS
       ========================================================= */

    .social-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .social-card {
      padding: 25px;
      text-align: center;
      transition: .3s;
    }

    .social-card:hover {
      transform: translateY(-5px);
      border-color: rgba(229,28,39,.3);
    }

    .social-card i {
      font-size: 27px;
      color: var(--red);
      margin-bottom: 12px;
    }

    .social-card strong {
      display: block;
      font-size: 14px;
    }

    .social-card small {
      color: var(--muted);
      display: block;
      margin-top: 5px;
      direction: ltr;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer {
      padding: 70px 5% 120px;
      border-top: 1px solid rgba(255,255,255,.07);
      margin-top: 40px;
    }

    .footer-grid {
      max-width: 1250px;
      margin: auto;
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 50px;
    }

    .footer-brand h3 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    .footer-brand p {
      color: var(--muted);
      line-height: 2;
      font-size: 13px;
      max-width: 400px;
    }

    .footer-col h4 {
      margin-bottom: 18px;
    }

    .footer-col a {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
      transition: .25s;
    }

    .footer-col a:hover {
      color: white;
      transform: translateX(-4px);
    }

    .footer-bottom {
      max-width: 1250px;
      margin: 45px auto 0;
      padding-top: 25px;
      border-top: 1px solid rgba(255,255,255,.07);
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #707788;
      font-size: 12px;
    }

    /* =========================================================
       FLOATING NAVIGATION
       ========================================================= */

    .floating-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1500;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px;
      border-radius: 19px;
      background: rgba(12,16,29,.82);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 50px rgba(0,0,0,.4);
    }

    .floating-nav a {
      width: 48px;
      height: 45px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #aeb4c2;
      font-size: 15px;
      transition: .25s;
      position: relative;
